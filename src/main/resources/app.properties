# Processos com markdown em knowledge/<processId>.md (separados por virgula).
# O repositorio publico lista o processo de exemplo. Para empacotar outro processo
# sem versiona-lo, use knowledge.local.properties (gitignored) com knowledge.processes=...
knowledge.processes=exemplo

openai.baseUrl=https://api.openai.com
openai.model=gpt-4o-mini
openai.timeoutSeconds=25
openai.temperature=0.15
openai.maxTokens=2048

chat.maxQuestionLength=2000
chat.maxHistoryTurns=6

security.rateLimit.requestsPerMinutePerUser=20
security.rateLimit.requestsPerMinutePerIp=60
security.rateLimit.trustForwardedFor=true
security.maxRequestSizeMb=1
